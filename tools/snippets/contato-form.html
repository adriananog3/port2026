<form class="cf" action="/api/contato" method="post" data-origem="{ORIGEM}" novalidate><style>.cf{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;font-family:'Open Sans',system-ui,sans-serif;color:#FDFBF7;text-align:left}.cf .full{grid-column:1/-1}.cf label{display:block;font-size:14px;font-weight:600;color:#FDFBF7;margin-bottom:6px;font-family:inherit}.cf label .op{font-weight:400;color:#9A9A9A}.cf input,.cf textarea{width:100%;box-sizing:border-box;background:#000;border:1px solid #898989;border-radius:6px;padding:12px 14px;font:inherit;font-size:16px;color:#FDFBF7}.cf textarea{min-height:130px;resize:vertical}.cf input::placeholder,.cf textarea::placeholder{color:#898989}.cf input:focus,.cf textarea:focus{outline:none;border-color:#C9A96E;box-shadow:0 0 0 2px rgba(201,169,110,.4)}.cf .ok{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;font-weight:400;color:#D9D9D9}.cf .ok input{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:#C9A96E}.cf .ok a{color:#C9A96E;text-decoration:underline}.cf button{justify-self:start;display:inline-flex;align-items:center;gap:10px;background:#C9A96E;color:#000;border:0;border-radius:999px;padding:14px 26px;font:inherit;font-size:16px;font-weight:800;cursor:pointer}.cf button:hover,.cf button:focus-visible{background:#b8965b}.cf button:disabled{opacity:.6;cursor:default}.cf .st{min-height:20px;font-size:14.5px;font-weight:600;color:#C9A96E}.cf .st.erro{color:#ff8a7a}.cf .fb{border:1px solid #C9A96E;border-radius:12px;padding:14px 16px;background:#0e0b07}.cf .fb p{margin:0 0 8px;font-size:14px;color:#D9D9D9}.cf .fb a{display:inline-block;margin:0 14px 6px 0;color:#C9A96E;font-weight:700;text-decoration:underline}.cf .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}@media(max-width:640px){.cf{grid-template-columns:1fr}}</style>
<div><label for="cf-nome-{ORIGEM}">Nome</label><input id="cf-nome-{ORIGEM}" name="nome" autocomplete="name" required placeholder="Seu nome"></div>
<div><label for="cf-email-{ORIGEM}">E-mail</label><input id="cf-email-{ORIGEM}" name="email" type="email" autocomplete="email" required placeholder="voce@empresa.com.br"></div>
<div><label for="cf-empresa-{ORIGEM}">Empresa <span class="op">(opcional)</span></label><input id="cf-empresa-{ORIGEM}" name="empresa" autocomplete="organization" placeholder="Nome da empresa"></div>
<div><label for="cf-tel-{ORIGEM}">Telefone ou WhatsApp <span class="op">(opcional)</span></label><input id="cf-tel-{ORIGEM}" name="telefone" type="tel" autocomplete="tel" placeholder="(11) 90000-0000"></div>
<div class="full"><label for="cf-msg-{ORIGEM}">Mensagem</label><textarea id="cf-msg-{ORIGEM}" name="mensagem" required placeholder="Conte o que você precisa"></textarea></div>
<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><input type="hidden" name="origem" value="{ORIGEM}">
<label class="ok full"><input type="checkbox" name="consentimento" value="sim" required> <span>Concordo que meus dados sejam usados apenas para responder a este contato, conforme a <a href="/politica-de-privacidade">Política de Privacidade</a> (LGPD).</span></label>
<button type="submit" class="full">Enviar mensagem →</button>
<p class="st full" role="status" aria-live="polite"></p>
<div class="fb full" hidden><p>Escolha como prefere enviar:</p><a class="fb-mail" href="mailto:contato-assessoria@adriana-nogueira.com">Enviar por e-mail</a><a href="https://wa.me/qr/2XEF52R64MEEF1" target="_blank" rel="noopener">WhatsApp</a><a href="https://tally.so/r/68GedB" target="_blank" rel="noopener">Formulário alternativo</a></div>
<script>(function(){var f=document.currentScript&&document.currentScript.closest('form.cf');if(!f||f.dataset.pronto)return;f.dataset.pronto='1';
var st=f.querySelector('.st'),fb=f.querySelector('.fb'),bt=f.querySelector('button[type=submit]');
function msg(t,e){st.textContent=t;st.classList.toggle('erro',!!e);}
f.addEventListener('submit',function(ev){ev.preventDefault();
 var req=[].slice.call(f.querySelectorAll('[required]'));for(var i=0;i<req.length;i++){var x=req[i];if(x.type==='checkbox'?!x.checked:!x.value.trim()){x.focus();msg(x.type==='checkbox'?'Marque a caixa de consentimento para enviar.':'Preencha este campo para enviar.',true);return;}}
 var d=new URLSearchParams(new FormData(f));bt.disabled=true;msg('Enviando…');
 fetch('/api/contato',{method:'POST',headers:{'X-Requested-With':'fetch','Content-Type':'application/x-www-form-urlencoded'},body:d.toString()})
 .then(function(r){return r.json().catch(function(){return {ok:false,fallback:true};});})
 .then(function(j){bt.disabled=false;if(j&&j.ok){msg(j.mensagem||'Mensagem enviada. Obrigada!');f.reset();fb.hidden=true;return;}
  msg((j&&j.mensagem)||'Não foi possível enviar agora.',true);
  if(j&&j.fallback){var g=function(n){var e=f.querySelector('[name='+n+']');return e?e.value.trim():'';};
   var corpo='Nome: '+g('nome')+'\nE-mail: '+g('email')+'\nEmpresa: '+g('empresa')+'\nTelefone: '+g('telefone')+'\n\n'+g('mensagem');
   f.querySelector('.fb-mail').href='mailto:contato-assessoria@adriana-nogueira.com?subject='+encodeURIComponent('Contato pelo site: '+g('nome'))+'&body='+encodeURIComponent(corpo);fb.hidden=false;}})
 .catch(function(){bt.disabled=false;msg('Sem conexão agora. Tente de novo em instantes.',true);});});})();</script>
</form>
